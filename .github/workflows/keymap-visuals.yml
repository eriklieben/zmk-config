name: Update keymap visuals

on:
  push:
    branches: [main]
    paths:
      - 'config/corne.keymap'
      - 'scripts/generate-keymap-svg/**'
      - '.github/workflows/keymap-visuals.yml'
  workflow_dispatch:

jobs:
  update-keymap-visuals:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Generate keymap SVGs and update README
        run: |
          cd scripts/generate-keymap-svg
          dotnet run -- \
            --keymap ../../config/corne.keymap \
            --output ../../docs/img \
            --layout corne \
            --update-readme ../../README.md

      - name: Commit updated visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/img/*.svg README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update keymap visuals [skip ci]"
            git push
          fi
